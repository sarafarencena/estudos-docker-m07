server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # O nome "api" vem do serviço e é resolvido na calculadora-net do Compose.
    location /api/ {
        proxy_pass http://api:5000/;
    }
}
